# 맥용 태권 글뚝딱 만들기 (GitHub 맥 서버). Actions 탭에서 [Run workflow] 로 실행
# 애플 개발자 서명이 아직 없어서 임시 서명(ad-hoc)만 함 → 처음 열 때 맥 설정에서 [그래도 열기] 필요
name: mac-build
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      - name: 임시 서명 + dmg 만들기
        run: |
          set -e
          VER=$(node -p "require('./package.json').version")
          for d in release/mac-arm64 release/mac; do
            [ -d "$d" ] || continue
            APP=$(ls -d "$d"/*.app | head -1)
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
            ARCH=$([ "$d" = release/mac-arm64 ] && echo 애플칩 || echo 인텔)
            STAGE=$(mktemp -d); cp -R "$APP" "$STAGE/"; ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "태권 글뚝딱" -srcfolder "$STAGE" -ov -format UDZO "release/태권글뚝딱-맥-${VER}-${ARCH}.dmg"
          done
          ls -la release/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: geulttukttak-mac
          path: release/*.dmg
          retention-days: 7
